name: Atlas scaffold coverage probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/v1/
            !/Atlas/
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Recount coverage with the pinned source index
        run: |
          set -euo pipefail
          ref="$(cat .github/autoform-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p build/coverage-probe
          git rev-parse HEAD > build/coverage-probe/checkout.txt
          uv run --no-project --with "git+https://github.com/facebookresearch/autoform-bot.git@${ref}" python -u - <<'PY'
          import re
          from pathlib import Path

          from autoform_cli.lean import index_project
          from scripts import generate_wiki as wiki

          index = index_project(wiki.ROOT, exclude_roots=("v1", "Atlas"))
          taxonomy = wiki.load_taxonomy()
          text = (wiki.VAULT / "coverage" / "README.md").read_text()
          for library in wiki.LIBRARIES:
              targets, summary = wiki.load_library(library, index, taxonomy)
              del targets
              documented = summary["documented"]
              instances = summary["instances"]
              undocumented = summary["public"] - instances - documented
              row = (
                  f"| v2 / {library} | DECOMPOSED | [{documented} documented public declarations]"
                  f"(../roadmap/README.md) across {len(summary['subjects'])} subjects; {instances} instances and "
                  f"{undocumented} undocumented public declarations are not articles. |"
              )
              text, n = re.subn(rf"(?m)^\| v2 / {library} \|.*$", lambda _: row, text)
              if n != 1:
                  raise SystemExit(f"Expected one coverage row for {library}")
              print(row)
          Path("build/coverage-probe/README.md").write_text(text)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-coverage-probe
          path: build/coverage-probe/
          if-no-files-found: error
          retention-days: 2
