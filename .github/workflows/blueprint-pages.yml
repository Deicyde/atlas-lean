name: Blueprint Pages

on:
  push:
    # wiki/** branches deploy a preview from a fork; see the deploy job.
    branches: [main, "wiki/**"]
    # Everything the build reads. generate_wiki.py and Autoform index every
    # Lean file outside the archived v1, wherever it lives, so a change to any
    # of them can leave the wiki out of step with the Lean.
    paths:
      - "**/*.lean"
      - "blueprint/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "theme/**"
      - "hooks/**"
      - ".github/autoform-ref"
      - ".github/workflows/blueprint-pages.yml"
      - "!v1/**"
  # Every pull request and merge queue group runs, whatever it changes, so the
  # wiki job can be a required check. One that changes none of the paths above
  # skips the build; see the pick job.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      newest:
        description: Try autoform-bot's newest main commit
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

# Runs that publish share one group, so no two deploy or pin at once, and a
# newer one replaces any still waiting. Each pull request and merge queue group
# gets a group of its own, where a newer push to the pull request replaces its
# run, so checks don't cancel each other or a waiting deploy.
concurrency:
  group: blueprint-pages-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The site builds with the Autoform commit in .github/autoform-ref. The daily
  # run, or a run started with "newest", tries autoform-bot's newest main commit
  # instead. Once the site builds with it and is published, the pin job commits
  # the new pin, with any pages the generator writes differently under it. A
  # commit that fails leaves the pin and the published site as they were.
  # Reverting a pin commit doesn't hold the wiki back, since the next run tries
  # the same commit again; disable this workflow to hold it. GitHub schedules
  # runs only on the default branch, which this branch is.
  pick:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      new: ${{ steps.pick.outputs.new }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the Autoform commit
        id: pick
        env:
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          ref="$(cat .github/autoform-ref)"
          if [ "$NEWEST" = true ]; then
            newest="$(git ls-remote "$AUTOFORM_SOURCE" refs/heads/main | cut -f1)"
            if [ "$newest" != "$ref" ]; then
              ref="$newest"
              echo "new=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The paths the push trigger lists, as one pattern. Both sides of a rename
      # are listed, and names aren't quoted, so a path that leaves the list or
      # holds a non-ASCII character still counts.
      - name: Check whether the change touches what the build reads
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed"
          if grep -v '^v1/' "$RUNNER_TEMP/changed" | grep -qE \
            -e '\.lean$' \
            -e '^(blueprint|scripts|theme|hooks)/' \
            -e '^mkdocs\.yml$' \
            -e '^\.github/(autoform-ref|workflows/blueprint-pages\.yml)$'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    # ci.yml has a job named build too, and required checks are matched by name.
    name: build the wiki
    needs: pick
    # A daily run with nothing new to try builds nothing, and neither does a
    # change that touches nothing the build reads.
    if: >-
      (github.event_name != 'schedule' || needs.pick.outputs.new == 'true') &&
      needs.pick.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      AUTOFORM_REF: ${{ needs.pick.outputs.ref }}
    steps:
      # The archived v1 release is not part of the wiki, and generate_wiki.py
      # skips it. Autoform indexes every Lean file under --lean-root, so with v1
      # checked out each v2 name it also declares would be ambiguous and
      # autoform check would fail on that article.
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/v1/
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The roadmap is generated from the v2 library sources;
      # fail if the committed pages differ from what the generator writes.
      - name: Check the generated pages
        if: needs.pick.outputs.new != 'true'
        run: |
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" python scripts/generate_wiki.py --check || {
            echo "::error::The pages above differ from what scripts/generate_wiki.py writes. Regenerate them with: uv run --no-project --with git+${AUTOFORM_SOURCE}@${AUTOFORM_REF} python scripts/generate_wiki.py"
            exit 1
          }

      # The generator reads the Lean sources through Autoform's index, so a newer
      # Autoform may write some pages differently. A run trying one builds from
      # the pages it writes, and hands them with the new pin to the pin job as a
      # patch. A page it would delete stops the run for a person to look at.
      - name: Regenerate the pages with the newer Autoform
        if: needs.pick.outputs.new == 'true'
        run: |
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" python scripts/generate_wiki.py
          echo "$AUTOFORM_REF" > .github/autoform-ref
          git add -A blueprint .github/autoform-ref
          if git diff --cached --no-renames --name-only --diff-filter=D -- blueprint | grep .; then
            echo "::error::Autoform ${AUTOFORM_REF:0:8} would delete the pages listed above."
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/pin.patch"

      - name: Keep the new pin and pages for the pin job
        if: needs.pick.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin
          path: ${{ runner.temp }}/pin.patch
          if-no-files-found: error
          retention-days: 1

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources.
      - name: Validate the theorem DAG and its declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      # Audit findings are quality debt rather than publication syntax errors.
      # Keep them visible on every build without hiding a usable in-progress wiki.
      - name: Report roadmap quality findings
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform audit blueprint --lean-root .

      # Writes site-src/: statement boxes, derived statuses, the shared DAG viewer,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --lean-root .
          --require-declarations

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.6.21
          --with mkdocs-literate-nav==0.6.2
          --with pymdown-extensions==10.21.3
          mkdocs build --strict

      - name: Check published routes, anchors, and article cards
        run: python scripts/check_blueprint_site.py site-src site

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wiki/')))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The check to require before merging. A skipped job counts as passing, so
  # the build alone would pass when the pick job failed and skipped it.
  wiki:
    needs: [pick, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a build that passed or had nothing to check
        env:
          PICK: ${{ needs.pick.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "pick: $PICK, build: $BUILD"
          [ "$PICK" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }

  pin:
    needs: [pick, build, deploy]
    if: needs.pick.outputs.new == 'true' && github.ref == 'refs/heads/wiki/autoform-blueprint'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the new pin and pages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin
          path: ${{ runner.temp }}/pin

      # No Lean or Python package code runs in the job that holds the write
      # token: the build wrote the commit's content, and this step only checks
      # that it changes nothing but pages and the pin and deletes no page. If
      # the branch has moved since the run started, the push fails and the next
      # daily or "newest" run tries again. A push made with this token starts no
      # workflow, so this commit does not rebuild the site it records.
      - name: Pin the Autoform commit the site was built with
        env:
          REF: ${{ needs.pick.outputs.ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git apply --index "$RUNNER_TEMP/pin/pin.patch"
          echo "$REF" > .github/autoform-ref
          git add .github/autoform-ref
          if git diff --cached --no-renames --name-only | grep -v -e '^blueprint/' -e '^\.github/autoform-ref$'; then
            echo "::error::The build's patch changes the files listed above."
            exit 1
          fi
          if git diff --cached --no-renames --name-only --diff-filter=D -- blueprint | grep .; then
            echo "::error::The build's patch deletes the pages listed above."
            exit 1
          fi
          git commit --quiet -m "Build the site with Autoform ${REF:0:8}"
          git push --quiet origin HEAD:wiki/autoform-blueprint

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wiki/')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
