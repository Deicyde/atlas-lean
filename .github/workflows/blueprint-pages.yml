name: Blueprint Pages

on:
  push:
    # wiki/** branches deploy a preview from a fork; see the deploy job.
    branches: [main, "wiki/**"]
    paths:
      - "blueprint/**"
      - "MathlibExt/**"
      - "CSLibExt/**"
      - "WantedExt/**"
      - "scripts/generate_wiki.py"
      - "mkdocs.yml"
      - "theme/**"
      - "hooks/**"
      - ".github/autoform-ref"
      - ".github/workflows/blueprint-pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - "scripts/generate_wiki.py"
      - "mkdocs.yml"
      - "theme/**"
      - "hooks/**"
      - ".github/autoform-ref"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Try autoform-bot's newest main commit
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

concurrency:
  group: blueprint-pages
  cancel-in-progress: false

jobs:
  # The site builds with the Autoform commit in .github/autoform-ref. The daily
  # run, or a run started with "newest", tries autoform-bot's newest main commit
  # instead, and the pin job records it once the site builds. A commit that
  # fails leaves the pin and the published site as they were. GitHub schedules
  # runs only on the default branch, so the daily run needs this branch to be
  # the fork's default; until then, start the workflow with "newest".
  pick:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      new: ${{ steps.pick.outputs.new }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the Autoform commit
        id: pick
        env:
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          ref="$(cat .github/autoform-ref)"
          if [ "$NEWEST" = true ]; then
            newest="$(git ls-remote "$AUTOFORM_SOURCE" refs/heads/main | cut -f1)"
            if [ "$newest" != "$ref" ]; then
              ref="$newest"
              echo "new=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    # A daily run with nothing new to try builds nothing.
    if: github.event_name != 'schedule' || needs.pick.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      AUTOFORM_REF: ${{ needs.pick.outputs.ref }}
    steps:
      # The archived v1 release is not part of the wiki, and generate_wiki.py
      # skips it. Autoform indexes every Lean file under --lean-root, so with v1
      # checked out each v2 name it also declares would be ambiguous and
      # autoform check would fail on that article.
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/v1/
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The roadmap is generated from the v2 library sources;
      # fail if the committed pages differ from what the generator writes.
      - name: Check the generated pages
        run: >-
          uv run --no-project --with "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          python scripts/generate_wiki.py --check

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources.
      - name: Validate the theorem DAG and its declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      # Audit findings are quality debt rather than publication syntax errors.
      # Keep them visible on every build without hiding a usable in-progress wiki.
      - name: Report roadmap quality findings
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform audit blueprint --lean-root .

      # Writes site-src/: statement boxes, derived statuses, the shared DAG viewer,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --lean-root .
          --require-declarations

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.6.21
          --with mkdocs-literate-nav==0.6.2
          --with pymdown-extensions==10.21.3
          mkdocs build --strict

      - name: Check published routes, anchors, and article cards
        run: python scripts/check_blueprint_site.py site-src site

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wiki/')))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pin:
    needs: [pick, build]
    if: needs.pick.outputs.new == 'true' && github.ref == 'refs/heads/wiki/autoform-blueprint'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A push made with this token starts no workflow, so this commit does not
      # rebuild the site it records.
      - name: Pin the Autoform commit the site was built with
        env:
          REF: ${{ needs.pick.outputs.ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "$REF" > .github/autoform-ref
          git commit --quiet -m "Build the site with Autoform ${REF:0:8}" .github/autoform-ref
          git pull --quiet --rebase origin wiki/autoform-blueprint
          git push --quiet origin HEAD:wiki/autoform-blueprint

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wiki/')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
