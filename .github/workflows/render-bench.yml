# Benchmarks `autoform render` on this vault, one job per autoform commit:
# wall time, peak memory, and a SHA-256 manifest of every output file, so a
# candidate can be checked for byte-identical output against the baseline.
# The "-profile" entry repeats the candidate under cProfile.

name: render bench

on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 2eae76d78be4ae4a6e9666e88affe0868b303af0
          - label: candidate
            ref: a7b38a80872045c3fb5ea38e270613dda91d8a4f
          - label: candidate-profile
            ref: a7b38a80872045c3fb5ea38e270613dda91d8a4f
            profile: true
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Render with autoform ${{ matrix.ref }}
        env:
          LABEL: ${{ matrix.label }}
          REF: ${{ matrix.ref }}
          PROFILE: ${{ matrix.profile && 'true' || '' }}
        run: |
          # Keep going when render fails (as --require-declarations does on a
          # missing declaration) so the measurements are still written.
          set +e -uo pipefail
          mkdir -p out
          uv venv --quiet /tmp/venv
          uv pip install --quiet --python /tmp/venv "git+https://github.com/facebookresearch/autoform-bot.git@$REF"
          profile=()
          [ -n "$PROFILE" ] && profile=(-m cProfile -o "out/prof-$LABEL.prof")
          # Stop short of the job limit so the measurements still upload.
          /usr/bin/time -v -o "out/time-$LABEL.txt" timeout 340m \
            /tmp/venv/bin/python "${profile[@]}" -m autoform_cli \
            render blueprint --output site-src --lean-root . --require-declarations \
            --repository-url https://github.com/Deicyde/atlas-lean --ref "$GITHUB_SHA" \
            2>&1 | tail -3
          grep -E 'Elapsed|Maximum resident|Exit status' "out/time-$LABEL.txt"
          if [ -d site-src ]; then
            (cd site-src && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "out/manifest-$LABEL.txt"
            echo "$LABEL: $(wc -l < "out/manifest-$LABEL.txt") files"
          fi
          if [ -n "$PROFILE" ]; then
            /tmp/venv/bin/python - "$LABEL" <<'EOF'
          import pstats, sys
          label = sys.argv[1]
          with open(f"out/top-{label}.txt", "w") as out:
              stats = pstats.Stats(f"out/prof-{label}.prof", stream=out)
              stats.sort_stats("cumulative").print_stats(60)
              stats.sort_stats("tottime").print_stats(40)
          EOF
            sed -n '1,80p' "out/top-$LABEL.txt"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-${{ matrix.label }}
          path: out/
          retention-days: 14

  compare:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: out
          merge-multiple: true

      - name: Compare candidates with the baseline
        run: |
          for t in out/time-*.txt; do echo "$t: $(grep -E 'Elapsed' "$t") $(grep -E 'Maximum resident' "$t")"; done
          [ -f out/manifest-baseline.txt ] || { echo "baseline did not finish; no comparison"; exit 0; }
          for manifest in out/manifest-*.txt; do
            label=${manifest#out/manifest-}; label=${label%.txt}
            [ "$label" = baseline ] && continue
            if cmp -s out/manifest-baseline.txt "$manifest"; then
              echo "$label: byte-identical to baseline"
            else
              echo "$label: DIFFERS from baseline"
              diff out/manifest-baseline.txt "$manifest" | head -40 || true
            fi
          done
