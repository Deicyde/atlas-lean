# Builds the ATLAS v2 libraries and dumps, for every declaration, the v2
# declarations its statement and proof use. scripts/extract_v2_lean_dependencies.py
# collapses the dump onto the roadmap's articles, into
# blueprint/sources/v2/lean-dependencies.json, which gives the wiki its
# "Depends on" lists. The run fails when the committed file differs from what
# this Lean gives, and its lean-dependencies artifact then holds a patch with
# the file and the pages regenerated from it.

name: v2 dependencies

on:
  push:
    branches: [main, "wiki/**"]
    # Everything the file is computed from: the compiled v2 libraries, and the
    # articles scripts/generate_wiki.py writes from their sources with the
    # pinned Autoform.
    paths:
      - ".github/workflows/v2-dependencies.yml"
      - ".github/autoform-ref"
      - "scripts/dump_v2_dependencies.lean"
      - "scripts/extract_v2_lean_dependencies.py"
      - "scripts/generate_wiki.py"
      - "blueprint/roadmap/**"
      - "blueprint/sources/v2/lean-dependencies.json"
      - "MathlibExt/**"
      - "CSLibExt/**"
      - "WantedExt/**"
      - "lake-manifest.json"
      - "lean-toolchain"
  # Every pull request and merge queue group runs, whatever it changes, so the
  # edges job can be a required check. One that changes none of the paths
  # above skips the dump; see the changes job.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

# A newer push to a pull request cancels its run. On a branch a newer push
# replaces a run still waiting, so a burst of merges cancels none that started:
# a cancelled run fails its edges job.
concurrency:
  group: v2-dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - name: Check out project
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The paths the push trigger lists, as one pattern. Both sides of a rename
      # are listed, and names aren't quoted, so a path that leaves the list or
      # holds a non-ASCII character still counts.
      - name: Check whether the change touches what the edges come from
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed"
          if grep -qE \
            -e '^(MathlibExt|CSLibExt|WantedExt|blueprint/roadmap)/' \
            -e '^blueprint/sources/v2/lean-dependencies\.json$' \
            -e '^scripts/(dump_v2_dependencies\.lean|extract_v2_lean_dependencies\.py|generate_wiki\.py)$' \
            -e '^\.github/(autoform-ref|workflows/v2-dependencies\.yml)$' \
            -e '^(lake-manifest\.json|lean-toolchain)$' \
            "$RUNNER_TEMP/changed"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  dump:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Lean caches
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Add swap for cold Lean builds
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          free -h

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Restore local build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: v2-deps-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            v2-deps-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # A module that fails upstream must not cost the rest of the dump: keep
      # building, record the failures, and dump every module that compiled.
      - name: Build the v2 libraries
        run: |
          # The runner's shell has -e on; turn it off so a failed module still
          # lets the dump step run.
          set +e -uo pipefail
          lake build MathlibExt CSLibExt WantedExt 2>&1 | tee build.log
          echo "lake build exit: ${PIPESTATUS[0]}"
          grep -E '^(✖|error:)' build.log > build-failures.txt || true
          cat build-failures.txt

      # Saved even after a failed build, so the next run only rebuilds what is
      # missing. Pull requests and merge queue groups restore it, but don't
      # save their own, which would push the branch's out of the cache.
      - name: Save local build
        if: >-
          always() && steps.build-cache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: v2-deps-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Dump declaration dependencies
        run: |
          set -euo pipefail
          olean_root=.lake/build/lib/lean
          [ -d "$olean_root" ] || olean_root=.lake/build/lib
          : > v2-modules.txt
          : > v2-unbuilt.txt
          for source in $(git ls-files 'MathlibExt/*.lean' 'CSLibExt/*.lean' 'WantedExt/*.lean'); do
            module=$(echo "${source%.lean}" | tr / .)
            if [ -f "$olean_root/${source%.lean}.olean" ]; then
              echo "$module" >> v2-modules.txt
            else
              echo "$module" >> v2-unbuilt.txt
            fi
          done
          echo "dumping $(wc -l < v2-modules.txt) modules; $(wc -l < v2-unbuilt.txt) did not build:"
          cat v2-unbuilt.txt
          # Importing every module at once fails when two of them declare the
          # same name (an upstream copy of something Mathlib now has). Drop the
          # ATLAS side of each collision and retry; v2-conflicts.txt lists them.
          : > v2-conflicts.txt
          dumped=
          for _attempt in $(seq 1 30); do
            if lake env lean --run scripts/dump_v2_dependencies.lean v2-modules.txt > v2-dependencies.jsonl 2> dump.err; then
              dumped=1
              break
            fi
            cat dump.err
            first=$(grep -oE "already contains '[^']+' from [A-Za-z0-9_.']+" dump.err | awk '{print $NF}' | head -1 || true)
            second=$(grep -oE "import [A-Za-z0-9_.']+ failed" dump.err | awk '{print $2}' | head -1 || true)
            if grep -qxF "$first" v2-modules.txt; then drop=$first
            elif grep -qxF "$second" v2-modules.txt; then drop=$second
            else exit 1
            fi
            echo "$drop (with $([ "$drop" = "$first" ] && echo "$second" || echo "$first"))" | tee -a v2-conflicts.txt
            grep -vxF "$drop" v2-modules.txt > v2-modules.next && mv v2-modules.next v2-modules.txt
          done
          [ -n "$dumped" ] || exit 1
          echo "collisions: $(wc -l < v2-conflicts.txt)"
          cat v2-conflicts.txt
          wc -l < v2-dependencies.jsonl
          gzip -9 v2-dependencies.jsonl

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The articles are the roadmap's `lean:` targets, which generate_wiki.py
      # writes from the Lean sources, so the pages are regenerated first.
      - name: Regenerate the pages
        run: uv run --no-project --with "git+${AUTOFORM_SOURCE}@$(cat .github/autoform-ref)" python scripts/generate_wiki.py

      # The file names this workflow as its source, not this run: a run's URL
      # would make every patch change that line, and any two patched pull
      # requests conflict on it.
      - name: Collapse dependencies onto the exact roadmap article manifest
        run: >-
          python scripts/extract_v2_lean_dependencies.py
          v2-dependencies.jsonl.gz
          .github/workflows/v2-dependencies.yml

      - name: Regenerate the pages with these edges
        run: uv run --no-project --with "git+${AUTOFORM_SOURCE}@$(cat .github/autoform-ref)" python scripts/generate_wiki.py

      # The patch holds the file and every page the generator writes differently
      # from the committed one. A pull request's run checks its merge with the
      # base, so the patch fits that merge, and the author merges the same base
      # before applying it.
      - name: Compare the edges with the committed ones
        run: |
          if [ -s build-failures.txt ]; then
            echo "::error::Some v2 modules don't build (see the build step), so the edges can't be checked."
            exit 1
          fi
          if git show HEAD:blueprint/sources/v2/lean-dependencies.json | diff -u - blueprint/sources/v2/lean-dependencies.json > edges.diff; then
            echo "The committed edges are this Lean's."
            exit 0
          fi
          head -n 200 edges.diff
          git add -A blueprint
          git diff --cached --binary > lean-dependencies.patch
          apply="gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n lean-dependencies && git apply lean-dependencies.patch"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            apply="git fetch ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} ${base} && git merge --no-edit ${base} && ${apply}"
          fi
          echo "::error::blueprint/sources/v2/lean-dependencies.json differs from this Lean's edges (diff above). Apply the patch this run made, with the file and the pages generated from it: ${apply}"
          exit 1

      - name: Keep the patch
        if: failure() && hashFiles('lean-dependencies.patch') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-dependencies
          path: lean-dependencies.patch
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: v2-dependencies
          path: |
            v2-dependencies.jsonl.gz
            v2-unbuilt.txt
            v2-conflicts.txt
            build-failures.txt
            blueprint/sources/v2/lean-dependencies.json
          retention-days: 14

  # The check to require before merging. A skipped job counts as passing, so
  # the dump alone would pass when the changes job failed and skipped it.
  edges:
    needs: [changes, dump]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a dump that passed or had nothing to check
        env:
          CHANGES: ${{ needs.changes.result }}
          DUMP: ${{ needs.dump.result }}
        run: |
          echo "changes: $CHANGES, dump: $DUMP"
          [ "$CHANGES" = success ] && { [ "$DUMP" = success ] || [ "$DUMP" = skipped ]; }
